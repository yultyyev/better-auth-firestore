name: PR Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, build, test (better-auth ${{ matrix.better-auth }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # "lockfile" runs against the pinned devDependency (1.7.x). The adapter
        # also supports Better Auth 1.6 from the same codebase, so the suite
        # runs against the latest 1.6 release too.
        better-auth: ["lockfile", "1.6"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Use better-auth ${{ matrix.better-auth }}
        if: matrix.better-auth != 'lockfile'
        run: |
          pnpm add -D better-auth@${{ matrix.better-auth }}
          node -p "'better-auth ' + require('./node_modules/better-auth/package.json').version"

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
